spring:
  application:
    name: ${spring.profiles.active}-storage
  cloud:
    compatibility-verifier:
      enabled: false
  config:
    import: classpath:application-topic.yml
  main:
    web-application-type: reactive
  kafka:
    bootstrap-servers: ${KAFKA_HOST}
    consumer:
      group-id: ${spring.application.name}
#  data:
#    mongodb:
#      uri: mongodb://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@${MONGODB_HOST}:27017/file?authSource=admin
  profiles:
    active: dev
  r2dbc:
    url: r2dbc:mysql://${mysql.host}:3306/storage?useUnicode=yes&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${RDBMS_USERNAME}
    password: ${RDBMS_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    url: jdbc:mysql://${mysql.host}:3306/storage
    user: ${spring.r2dbc.username}
    password: ${spring.r2dbc.password}
    locations: classpath:db/migration
  cassandra:
    keyspace-name: storage_keyspace
    contact-points: ${CASSANDRA_URL}
    username: ${CASSANDRA_USERNAME}
    password: ${CASSANDRA_PASSWORD}
    schema-action: create_if_not_exists
    local-datacenter: datacenter1
minio:
  endpoint: ${MINIO_URL}

discovery-host:
  auth: 'discovery:///${spring.profiles.active}-${AUTH_NAME}'

grpc:
  server:
    port: 9090
  client:
    auth:
      address: ${discovery-host.auth}
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext

server:
  http2:
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI}
  instance:
    prefer-ip-address: false
    hostname: storage

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# custom
mysql:
  host: ${RDBMS_URL}

pyroscope:
  address: ${PYROSCOPE_SERVER_ADDRESS}